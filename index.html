<!DOCTYPE html>
<html>
<head>
  <title>Placement Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>Placement Portal</h1>
  <button class="toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

<!-- AUTH -->
<div class="container" id="authBox">
  <h2>Login / Register</h2>

  <input id="authName" placeholder="Name">
  <input id="authEmail" placeholder="Email">
  <input id="authPassword" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div class="container" id="appBox" style="display:none;">

  <p id="msg"></p>
  <button onclick="logout()">Logout</button>

  <h2>Add Job</h2>
  <input id="title" placeholder="Job Title">
  <input id="company" placeholder="Company">
  <input id="location" placeholder="Location">
  <button onclick="addJob()">Add Job</button>
  
  <h2>Search</h2>
  <input id="search" placeholder="Search..." oninput="getJobs()">

<select id="filterCompany" onchange="getJobs()">
  <option value="all">All Companies</option>
</select>

  <h2>Jobs</h2>
  <div id="jobsList"></div>

  <h2>My Applications</h2>
  <ul id="appliedList"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
