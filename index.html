<!DOCTYPE html>
<html>
<head>
  <title>Placement Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Placement Portal</h1>

<div class="container">

  <p id="msg"></p>

  <h2>User Info</h2>
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">

  <h2>Add Job</h2>
  <input id="title" placeholder="Job Title">
  <input id="company" placeholder="Company">
  <input id="location" placeholder="Location">
  <button onclick="addJob()">Add Job</button>

  <h2>Search & Filter</h2>
  <input id="search" placeholder="Search job title..." oninput="getJobs()">
  <input id="filterLocation" placeholder="Filter by location" oninput="getJobs()">

  <h2>All Jobs</h2>
  <button onclick="getJobs()">Show Jobs</button>
  <ul id="jobsList"></ul>

  <h2>My Applications</h2>
  <button onclick="showApplied()">Show Applied Jobs</button>
  <ul id="appliedList"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
